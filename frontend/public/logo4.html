<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logo animado</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(ellipse at 50% 40%, #241205 0%, #0b0603 72%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .stage{width:min(78vw,78vh,620px);aspect-ratio:1/1;}
  svg{
    width:100%;height:100%;
    filter:drop-shadow(0 0 22px rgba(255,120,20,.35));
    overflow:visible;
  }

  /* orbit ribbon: continuous full rotation */
  .orbit{
    transform-origin:400px 380px;
    animation:spin 11s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* gear: continuous rotation, its own speed */
  .gear{
    transform-origin:680px 640px;
    animation:spin 6s linear infinite;
  }

  /* wrench: tightening oscillation around the ring */
  .wrenchAnim{
    transform-origin:0px 0px;
    animation:torque 2.6s ease-in-out infinite;
  }
  @keyframes torque{
    0%,100%{ transform:rotate(-7deg); }
    50%{ transform:rotate(7deg); }
  }

  /* screwdriver: opposite-phase twist */
  .screwdriverAnim{
    transform-origin:0px 0px;
    animation:torque2 2.6s ease-in-out infinite;
  }
  @keyframes torque2{
    0%,100%{ transform:rotate(6deg); }
    50%{ transform:rotate(-6deg); }
  }

  /* chat bubble: sequential typing lines */
  .line{ animation:type 3.6s ease-in-out infinite; }
  .line1{ animation-delay:0s; }
  .line2{ animation-delay:.35s; }
  .line3{ animation-delay:.7s; }
  @keyframes type{
    0%{ transform:scaleX(0); }
    30%,60%{ transform:scaleX(1); }
    85%,100%{ transform:scaleX(0); }
  }

  /* code brackets: gentle breathing */
  .codeText{
    animation:breathe 3.2s ease-in-out infinite;
    transform-origin:120px 375px;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:.9; }
    50%{ transform:scale(1.12); opacity:1; }
  }

  /* small panels: soft independent float */
  .floatA{ animation:bobA 4.2s ease-in-out infinite; }
  .floatB{ animation:bobB 5s ease-in-out infinite; }
  .floatC{ animation:bobC 4.6s ease-in-out infinite; }
  @keyframes bobA{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  @keyframes bobB{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);} }
  @keyframes bobC{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

  @media (prefers-reduced-motion: reduce){
    .orbit,.gear,.wrenchAnim,.screwdriverAnim,.line,.codeText,.floatA,.floatB,.floatC{
      animation:none !important;
    }
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="30%" stop-color="#ffb020"/>
      <stop offset="65%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1608"/>
      <stop offset="100%" stop-color="#140a03"/>
    </linearGradient>
  </defs>

  <!-- orbit ribbon, passes behind everything -->
  <g class="orbit">
    <ellipse cx="400" cy="380" rx="370" ry="150" transform="rotate(-16 400 380)"
      fill="none" stroke="url(#amberGrad)" stroke-width="24" stroke-linecap="round"
      stroke-dasharray="640 480"/>
  </g>

  <!-- code panel -->
  <g class="floatA">
    <rect x="36" y="290" width="168" height="168" rx="30" fill="url(#panelGrad)" stroke="url(#amberGrad)" stroke-width="6"/>
    <text class="codeText" x="120" y="395" font-family="Menlo, Consolas, monospace" font-size="62"
      fill="url(#amberGrad)" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- chat panel -->
  <g class="floatB">
    <rect x="556" y="46" width="224" height="150" rx="30" fill="url(#panelGrad)" stroke="url(#amberGrad)" stroke-width="6"/>
    <rect class="line line1" x="590" y="86"  width="156" height="13" rx="6.5" fill="url(#amberGrad)"/>
    <rect class="line line2" x="590" y="116" width="156" height="13" rx="6.5" fill="url(#amberGrad)"/>
    <rect class="line line3" x="590" y="146" width="104" height="13" rx="6.5" fill="url(#amberGrad)"/>
  </g>

  <!-- gear panel -->
  <g class="floatC">
    <rect x="596" y="556" width="168" height="168" rx="30" fill="url(#panelGrad)" stroke="url(#amberGrad)" stroke-width="6"/>
    <g class="gear">
      <g fill="url(#amberGrad)">
        <rect x="673" y="592" width="14" height="24" rx="4" transform="rotate(0 680 640)"/>
        <rect x="673" y="592" width="14" height="24" rx="4" transform="rotate(45 680 640)"/>
        <rect x="673" y="592" width="14" height="24" rx="4" transform="rotate(90 680 640)"/>
        <rect x="673" y="592" width="14" height="24" rx="4" transform="rotate(135 680 640)"/>
        <rect x="673" y="592" width="14" height="24" rx="4" transform="rotate(180 680 640)"/>
        <rect x="673" y="592" width="14" height="24" rx="4" transform="rotate(225 680 640)"/>
        <rect x="673" y="592" width="14" height="24" rx="4" transform="rotate(270 680 640)"/>
        <rect x="673" y="592" width="14" height="24" rx="4" transform="rotate(315 680 640)"/>
      </g>
      <circle cx="680" cy="640" r="30" fill="url(#amberGrad)"/>
      <circle cx="680" cy="640" r="13" fill="#140a03"/>
    </g>
  </g>

  <!-- main window -->
  <g>
    <rect x="196" y="150" width="408" height="408" rx="46" fill="url(#panelGrad)" stroke="url(#amberGrad)" stroke-width="8"/>
    <circle cx="248" cy="196" r="9" fill="url(#amberGrad)"/>
    <circle cx="279" cy="196" r="9" fill="url(#amberGrad)"/>
    <circle cx="310" cy="196" r="9" fill="url(#amberGrad)"/>

    <!-- wrench: ring head + handle, pivots at the ring -->
    <g transform="translate(470,300) rotate(-45)">
      <g class="wrenchAnim">
        <rect x="-190" y="-15" width="190" height="30" rx="15" fill="url(#amberGrad)"/>
        <rect x="-70" y="-7" width="26" height="14" rx="4" fill="#140a03" opacity=".55"/>
        <rect x="-110" y="-7" width="26" height="14" rx="4" fill="#140a03" opacity=".55"/>
        <circle cx="0" cy="0" r="32" fill="none" stroke="url(#amberGrad)" stroke-width="16"/>
      </g>
    </g>

    <!-- screwdriver: handle + shaft + tip, pivots near the handle -->
    <g transform="translate(330,300) rotate(45)">
      <g class="screwdriverAnim">
        <rect x="-92" y="-26" width="92" height="52" rx="18" fill="url(#amberGrad)"/>
        <rect x="-66" y="-14" width="6" height="28" rx="3" fill="#140a03" opacity=".5"/>
        <rect x="-46" y="-14" width="6" height="28" rx="3" fill="#140a03" opacity=".5"/>
        <rect x="0" y="-8" width="188" height="16" rx="8" fill="url(#amberGrad)"/>
        <rect x="186" y="-11" width="26" height="22" rx="4" fill="url(#amberGrad)"/>
      </g>
    </g>
  </g>
</svg>
</div>
</body>
</html>
